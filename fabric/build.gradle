plugins {
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // ModMenu
    modCompileOnly modRuntimeOnly("com.terraformersmc:modmenu:$rootProject.mod_menu_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Config
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // LevelZ (Fabric-only, no NeoForge port)
    modCompileOnly("maven.modrinth:levelz:$rootProject.levelz_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // EasyAnvils
    modCompileOnly("$rootProject.easy_anvils_fabric_file") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Accessories (optional compat)
    modCompileOnly "io.wispforest:accessories-fabric:$rootProject.accessories_version"
    // Trinkets (Fabric-only accessory-slot provider, alternative to Accessories)
    modCompileOnly "$rootProject.trinkets_fabric_file"
    // Cardinal Components API - Trinkets' TrinketComponent extends its ComponentV3, needed at compile time
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"

    modCompileOnly "$rootProject.spell_engine_fabric_file"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

unifiedPublishing {
    project {
        gameVersions = ["1.21.1"]
        gameLoaders = ["fabric"]

        mainPublication tasks.remapJar

        displayName = "Tiered More [${project.name.toUpperCase()}] [${rootProject.minecraft_version}] - [${project.version}]"
        releaseType = "release" // "release", "beta" or "alpha"

        def changelogFile = rootProject.file("CHANGELOG.md")
        def changelogText = changelogFile.exists() ? changelogFile.text : ""
        changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

        var cfToken = project.findProperty("cfToken") ?: System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "1275090"
            }
        }

        var mrToken = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "tiered-more"
            }
        }
    }
}

tasks.matching { it.name.startsWith("modrinth") }.configureEach {
    group = "upload"
}
