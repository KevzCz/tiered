plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Config
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    // Puzzles Lib (required by EasyAnvils on NeoForge)
    modCompileOnly "$rootProject.puzzleslib_neoforge_file"

    // EasyAnvils
    modCompileOnly "$rootProject.easy_anvils_neoforge_file"

    // Accessories (optional compat)
    modCompileOnly "io.wispforest:accessories-neoforge:$rootProject.accessories_version"
    // Curios (NeoForge-only accessory-slot provider, alternative to Accessories)
    modCompileOnly "$rootProject.curios_neoforge_file"

    modCompileOnly "$rootProject.spell_engine_neoforge_file"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    // The per-task dryRun is wired from this and finalized in the task constructor, so it
    // has to be set here. Keyed off the requested task names so publishModsDry rehearses
    // while a plain publishMods still uploads for real.
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "Tiered More [NEOFORGE] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("neoforge")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "1275090"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }

    modrinth {
        projectId = "wDFzm2aY"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
    }
}

tasks.register("publishModsDry", Copy) {
    group = "publishing"
    description = "Dry run of publishMods — writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
