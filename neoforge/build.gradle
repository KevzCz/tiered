plugins {
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Config
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    // Puzzles Lib (required by EasyAnvils on NeoForge)
    modCompileOnly "$rootProject.puzzleslib_neoforge_file"

    // EasyAnvils
    modCompileOnly "$rootProject.easy_anvils_neoforge_file"

    // Accessories (optional compat)
    modCompileOnly "io.wispforest:accessories-neoforge:$rootProject.accessories_version"
    // Curios (NeoForge-only accessory-slot provider, alternative to Accessories)
    modCompileOnly "$rootProject.curios_neoforge_file"

    modCompileOnly "$rootProject.spell_engine_neoforge_file"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

unifiedPublishing {
    project {
        gameVersions = ["1.21.1"]
        gameLoaders = ["neoforge"]

        mainPublication tasks.remapJar

        displayName = "Tiered More [${project.name.toUpperCase()}] [${rootProject.minecraft_version}] - [${project.version}]"
        releaseType = "release" // "release", "beta" or "alpha"

        def changelogFile = rootProject.file("CHANGELOG.md")
        def changelogText = changelogFile.exists() ? changelogFile.text : ""
        changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText
        
        var cfToken = project.findProperty("cfToken") ?: System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "1275090"
                gameVersions = ["1.21.1", "Client", "Server"]
            }
        }

        var mrToken = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "tiered-more"
            }
        }
    }
}

tasks.matching { it.name.startsWith("modrinth") }.configureEach {
    group = "upload"
}
